          console.log(JSON.stringify({ observed: 'COMMITTED_INDEX_RAW_BYTES_VERIFIED', sourceSha: head, verifiedFiles: records.length, full195Certified: false }));
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned mobile metadata runtime without regeneration
        run: node scripts/build-mobile-metadata-runtime.mjs --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Create and boot a new disposable iOS Simulator
        shell: bash
        run: |
          node scripts/feature-acceptance/create-disposable-ios-simulator.mjs
      - name: Run independently counted component and client-scenario entries
        run: node scripts/feature-acceptance/run-ci-mobile-entries.mjs ios "$FEATURE_SIMULATOR" "${{ matrix.entry-group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-ios-${{ matrix.entry-group }}-${{ github.sha }}
          path: ${{ runner.temp }}/feature-native-ios/
          if-no-files-found: error
      - name: Stop only the newly created test simulator
        if: always() && env.FEATURE_SIMULATOR != ''
        run: xcrun simctl shutdown "$FEATURE_SIMULATOR"

  full-client-feature-matrix:
    if: always()
    needs: [desktop-components, android-components]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-components-*-${{ github.sha }}
          path: ${{ runner.temp }}/all-native-evidence
          merge-multiple: false
      - name: Install locked rejection-test dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check matrix rejection rules
        run: node --test scripts/feature-acceptance/release-feature-scope.test.mjs scripts/feature-acceptance/full-feature-matrix.test.mjs scripts/feature-acceptance/mobile-scenario-receipt.test.mjs scripts/feature-acceptance/mobile-entry-consistency.test.mjs scripts/feature-acceptance/native-proof-stream.test.mjs scripts/feature-acceptance/native-resident-pending.test.mjs scripts/feature-acceptance/native-begin-entry-parity.test.mjs scripts/feature-acceptance/metadata-import-wrapper.test.mjs scripts/feature-acceptance/prepare-android-image.test.mjs
      - name: Require 153 scoped cells across four release platforms (three Artist cells not-supported; iOS excluded)
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')"
          node scripts/feature-acceptance/build-full-feature-matrix.mjs "$RUNNER_TEMP/all-native-evidence" "$RUNNER_TEMP/full-feature-matrix" "$GITHUB_SHA" "$version" --require-release-scope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-platform-feature-evidence
          path: ${{ runner.temp }}/full-feature-matrix/
          if-no-files-found: error
