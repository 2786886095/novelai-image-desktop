name: Native Client Feature Acceptance

on:
  workflow_dispatch:
    inputs:
      windows_artist_evidence_commit:
        description: Immutable same-repository commit of previously executed local Windows GPU proof (not hosted execution)
        type: string
        default: ''
        required: false

# This workflow executes the current Windows/macOS desktop release scope and preserves bounded observations.
permissions:
  contents: read
  actions: read

jobs:
  desktop-components:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve exact committed bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Verify exact checkout bytes against index and commit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          function git(args, encoding) {
            const result = cp.spawnSync('git', args, { encoding, maxBuffer: 64 * 1024 * 1024 });
            if (result.error || result.status !== 0) {
              throw new Error('Git command failed: ' + JSON.stringify(args) + '; exit=' + result.status + '; ' + (result.stderr || ''));
            }
            return result.stdout;
          }
          const head = git(['rev-parse', 'HEAD'], 'utf8').trim();
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') || head !== process.env.GITHUB_SHA) {
            throw new Error('Checkout HEAD must equal GITHUB_SHA.');
          }
          // Index must still be exactly the committed tree; this alone is NOT a raw-byte proof.
          git(['diff', '--cached', '--exit-code'], 'utf8');
          const records = git(['ls-files', '--stage', '-z']).toString('utf8').split('\0').filter(Boolean);
          if (!records.length) throw new Error('No tracked checkout files found.');
          const mismatches = [];
          for (const record of records) {
            const match = /^([0-7]{6}) ([a-f0-9]{40}) ([0-3])\t([\s\S]+)$/.exec(record);
            if (!match || match[3] !== '0') throw new Error('Unmerged or invalid Git index entry.');
            const mode = match[1], oid = match[2], file = match[4];
            let bytes;
            if (mode === '120000') {
              bytes = fs.readlinkSync(file, { encoding: 'buffer' });
            } else if (mode === '100644' || mode === '100755') {
              bytes = fs.readFileSync(file);
            } else {
              throw new Error('Unsupported tracked entry mode: ' + mode + ' ' + file);
            }
            const actual = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            if (actual !== oid) mismatches.push(file);
          }
          if (mismatches.length) throw new Error('Raw checkout byte mismatch: ' + JSON.stringify(mismatches));
          console.log(JSON.stringify({ observed: 'COMMITTED_INDEX_RAW_BYTES_VERIFIED', sourceSha: head, verifiedFiles: records.length, full195Certified: false }));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Check bounded native command and fixture cleanup
        run: node --test scripts/feature-acceptance/bounded-native-command.test.mjs scripts/feature-acceptance/mac-native-keychain.test.mjs scripts/feature-acceptance/native-fixture-tls.test.mjs scripts/feature-acceptance/native-controller-bootstrap.test.mjs scripts/feature-acceptance/generation-fixture-cleanup.test.mjs scripts/feature-acceptance/desktop-native-diagnostics.test.mjs scripts/feature-acceptance/desktop-native-expansion.test.mjs
      - name: Execute real host native production components
        shell: bash
        run: |
          failed=0
          for pair in desktop-native:desktop-acceptance desktop-offline-native:desktop-offline-acceptance desktop-ai-native:desktop-ai-acceptance desktop-generation-native:desktop-generation-acceptance desktop-library-native:desktop-library-acceptance desktop-system-native:desktop-system-acceptance desktop-browser-native:desktop-browser-acceptance desktop-tools-gallery-native:desktop-tools-gallery-acceptance; do
            if [ "${pair%%:*}" = desktop-tools-gallery-native ]; then
              node "scripts/feature-acceptance/run-${pair%%:*}.mjs" "$RUNNER_TEMP/${pair#*:}" "$GITHUB_SHA" "$RUNNER_TEMP/desktop-generation-acceptance" || failed=1
            else
              node "scripts/feature-acceptance/run-${pair%%:*}.mjs" "$RUNNER_TEMP/${pair#*:}" "$GITHUB_SHA" || failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-acceptance/desktop-*-receipt.json
            ${{ runner.temp }}/desktop-acceptance/EVIDENCE_MANIFEST.json
            ${{ runner.temp }}/desktop-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-acceptance/*/NATIVE_CORE_REPORT.json
            ${{ runner.temp }}/desktop-acceptance/*/SETUP.json
            ${{ runner.temp }}/desktop-acceptance/*/desktop-journeys.cjs
            ${{ runner.temp }}/desktop-acceptance/*/compile.json
            ${{ runner.temp }}/desktop-offline-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-offline-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-offline-acceptance/*/OFFLINE_NATIVE_REPORT.json
            ${{ runner.temp }}/desktop-offline-acceptance/*/OFFLINE_REOPEN.json
            ${{ runner.temp }}/desktop-offline-acceptance/*/REOPEN_EXPECTED.json
            ${{ runner.temp }}/desktop-offline-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-offline-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-ai-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-ai-acceptance/*-scenarios.json
            ${{ runner.temp }}/desktop-ai-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-ai-acceptance/*/MAC_NATIVE_KEYCHAIN.json
            ${{ runner.temp }}/desktop-ai-acceptance/*/*REPORT.json
            ${{ runner.temp }}/desktop-ai-acceptance/*/COLD_REOPEN.json
            ${{ runner.temp }}/desktop-ai-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-ai-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-generation-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-generation-acceptance/*-scenarios.json
            ${{ runner.temp }}/desktop-generation-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-generation-acceptance/*/MAC_NATIVE_KEYCHAIN.json
            ${{ runner.temp }}/desktop-generation-acceptance/*/*REPORT.json
            ${{ runner.temp }}/desktop-generation-acceptance/*/BOOTSTRAP_PHASES.jsonl
            ${{ runner.temp }}/desktop-generation-acceptance/*/MAC_NATIVE_STALL*
            ${{ runner.temp }}/desktop-generation-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-generation-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-library-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-library-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-library-acceptance/*/LIBRARY_NATIVE_REPORT.json
            ${{ runner.temp }}/desktop-library-acceptance/*/LIBRARY_REOPEN.json
            ${{ runner.temp }}/desktop-library-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-library-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-system-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-system-acceptance/*-scenarios.json
            ${{ runner.temp }}/desktop-system-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-system-acceptance/*/MAC_NATIVE_KEYCHAIN.json
            ${{ runner.temp }}/desktop-system-acceptance/*/*REPORT.json
            ${{ runner.temp }}/desktop-system-acceptance/*/BOOTSTRAP_PHASES.jsonl
            ${{ runner.temp }}/desktop-system-acceptance/*/MAC_NATIVE_STALL*
            ${{ runner.temp }}/desktop-system-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-system-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-browser-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-browser-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-browser-acceptance/*/BROWSER_NATIVE_REPORT.json
            ${{ runner.temp }}/desktop-browser-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-browser-acceptance/*/source-after/**
            ${{ runner.temp }}/desktop-browser-acceptance/*/official-assets/PUBLIC_ASSET_GETS.json
            ${{ runner.temp }}/desktop-browser-acceptance/*/BROWSER_REOPEN.json
            ${{ runner.temp }}/desktop-tools-gallery-acceptance/*-receipt.json
            ${{ runner.temp }}/desktop-tools-gallery-acceptance/*/command-ledger.json
            ${{ runner.temp }}/desktop-tools-gallery-acceptance/*/*REPORT.json
            ${{ runner.temp }}/desktop-tools-gallery-acceptance/*/source-before/**
            ${{ runner.temp }}/desktop-tools-gallery-acceptance/*/source-after/**
          if-no-files-found: error

  windows-artist-local-proof:
    # Admit genuine local hardware execution; this job does not run a GPU model.
    # Missing/failed proof leaves the unchanged Windows Artist cell unverified.
    if: github.event_name == 'workflow_dispatch' && inputs.windows_artist_evidence_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve exact committed bytes before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Check local GPU proof rejection rules (unit checks, not native certification)
        run: node --test scripts/feature-acceptance/windows-artist-contract.test.mjs scripts/feature-acceptance/windows-artist-native.test.mjs scripts/feature-acceptance/windows-artist-matrix.test.mjs scripts/feature-acceptance/import-windows-artist-evidence.test.mjs
      - name: Verify immutable local Windows GPU proof against this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ARTIST_EVIDENCE_COMMIT: ${{ inputs.windows_artist_evidence_commit }}
        run: node scripts/feature-acceptance/import-windows-artist-evidence.mjs --evidence-commit "$WINDOWS_ARTIST_EVIDENCE_COMMIT" --source-sha "$GITHUB_SHA" --out "$RUNNER_TEMP/windows-artist-admitted"
      - uses: actions/upload-artifact@v4
        with:
          name: native-components-windows-artist-${{ github.sha }}
          path: ${{ runner.temp }}/windows-artist-admitted/
          if-no-files-found: error

  full-client-feature-matrix:
    if: always()
    needs: [desktop-components, windows-artist-local-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-components-*-${{ github.sha }}
          path: ${{ runner.temp }}/all-native-evidence
          merge-multiple: false
      - name: Install locked rejection-test dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check matrix rejection rules
        run: node --test scripts/feature-acceptance/release-feature-scope.test.mjs scripts/feature-acceptance/full-feature-matrix.test.mjs scripts/feature-acceptance/windows-artist-contract.test.mjs scripts/feature-acceptance/windows-artist-native.test.mjs scripts/feature-acceptance/windows-artist-matrix.test.mjs scripts/feature-acceptance/import-windows-artist-evidence.test.mjs
      - name: Require 71 scoped cells across both desktop release platforms (one Windows-local capability cell not-supported)
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')"
          node scripts/feature-acceptance/build-full-feature-matrix.mjs "$RUNNER_TEMP/all-native-evidence" "$RUNNER_TEMP/full-feature-matrix" "$GITHUB_SHA" "$version" --require-release-scope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-feature-evidence
          path: ${{ runner.temp }}/full-feature-matrix/
          if-no-files-found: error
