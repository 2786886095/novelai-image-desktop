name: Native Feature Acceptance Components

on:
  workflow_dispatch:

# This workflow collects bounded native journeys. It never publishes or replaces
# the existing 195-feature release verification contract.
permissions:
  contents: read

jobs:
  desktop-components:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure Linux test display and Chromium sandbox (CI only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb fonts-noto-cjk
          node -e "console.log(require('electron'))"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Execute real host native production components
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/feature-acceptance/run-desktop-native.mjs "$RUNNER_TEMP/desktop-acceptance" "$GITHUB_SHA"
          else
            node scripts/feature-acceptance/run-desktop-native.mjs "$RUNNER_TEMP/desktop-acceptance" "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-acceptance/
          if-no-files-found: error

  android-components:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Fresh disposable Android Emulator journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: |
            node scripts/feature-acceptance/run-ci-mobile-entries.mjs android emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-android-${{ github.sha }}
          path: ${{ runner.temp }}/feature-native-android/
          if-no-files-found: error

  ios-components:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Create and boot a new disposable iOS Simulator
        shell: bash
        run: |
          node scripts/feature-acceptance/create-disposable-ios-simulator.mjs
      - name: Run all three actual iOS native component entries
        run: node scripts/feature-acceptance/run-ci-mobile-entries.mjs ios "$FEATURE_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-ios-${{ github.sha }}
          path: ${{ runner.temp }}/feature-native-ios/
          if-no-files-found: error
      - name: Stop only the newly created test simulator
        if: always() && env.FEATURE_SIMULATOR != ''
        run: xcrun simctl shutdown "$FEATURE_SIMULATOR"
