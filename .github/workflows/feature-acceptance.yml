            const mode = match[1], oid = match[2], file = match[4];
            let bytes;
            if (mode === '120000') {
              bytes = fs.readlinkSync(file, { encoding: 'buffer' });
            } else if (mode === '100644' || mode === '100755') {
              bytes = fs.readFileSync(file);
            } else {
              throw new Error('Unsupported tracked entry mode: ' + mode + ' ' + file);
            }
            const actual = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            if (actual !== oid) mismatches.push(file);
          }
          if (mismatches.length) throw new Error('Raw checkout byte mismatch: ' + JSON.stringify(mismatches));
          console.log(JSON.stringify({ observed: 'COMMITTED_INDEX_RAW_BYTES_VERIFIED', sourceSha: head, verifiedFiles: records.length, full195Certified: false }));
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned mobile metadata runtime without regeneration
        run: node scripts/build-mobile-metadata-runtime.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Require runner-only KVM access and usable acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { printf '%s\n' 'KVM_DEVICE unavailable: /dev/kvm' >&2; exit 1; }
          if ! command -v setfacl >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends acl
          fi
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { printf '%s\n' 'KVM_DEVICE access denied: /dev/kvm' >&2; exit 1; }
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            printf '%s\n' 'SDK_ROOT unavailable: ANDROID_HOME / ANDROID_SDK_ROOT' >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            printf 'SDKMANAGER unavailable: %s\n' "$sdkmanager" >&2
            exit 1
          fi
          "$sdkmanager" --channel=0 --install "emulator"
          emulator="$sdk_root/emulator/emulator"
          if [ ! -x "$emulator" ]; then
            printf 'EMULATOR unavailable: %s\n' "$emulator" >&2
            exit 1
          fi
          "$emulator" -accel-check
      - name: Prepare fixed Android image with bounded archive recovery
        run: node scripts/feature-acceptance/prepare-android-image.mjs
      - name: Fresh disposable Android Emulator journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -accel on
          script: |
            node scripts/feature-acceptance/run-ci-mobile-entries.mjs android emulator-5554 "${{ matrix.entry-group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-android-${{ matrix.entry-group }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/feature-native-android/
            ${{ runner.temp }}/android-image-preparation-*/
          if-no-files-found: error

