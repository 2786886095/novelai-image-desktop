name: iOS folder native diagnostic only

on:
  push:
    branches: ['codex/release-2.6.8-comic-parity-ba4304ed']
    paths:
      - .github/workflows/ios-folder-native-diagnostic.yml
      - scripts/feature-acceptance/ios-folder-native-diagnostic.test.mjs
      - scripts/feature-acceptance/ios-folder-picker-driver.mjs
      - scripts/feature-acceptance/ios-folder-picker-driver.test.mjs
      - scripts/feature-acceptance/ios-folder-picker-observer.test.mjs
      - scripts/feature-acceptance/native-resident-pending.test.mjs
      - scripts/feature-acceptance/native-proof-stream.mjs
      - scripts/feature-acceptance/fixtures/ios-process-identity.c
      - scripts/feature-acceptance/fixtures/ios-folder-picker-ui.swift
  workflow_dispatch:

# Deliberately not the formal Native Client Feature Acceptance workflow.
# This single real scenario cannot replace its 187 scoped release cells.
permissions:
  contents: read
  actions: read

jobs:
  ios-folder1-diagnostic-only:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Preserve exact committed bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - name: Use Xcode SDK matching the iOS 26.2 simulator under test
        shell: bash
        run: |
          set -euo pipefail
          developer=''
          for path in /Applications/Xcode_26.2.app/Contents/Developer /Applications/Xcode_26.3.app/Contents/Developer; do
            [ -d "$path" ] || continue
            sdk="$(DEVELOPER_DIR="$path" xcrun --sdk iphonesimulator --show-sdk-version)"
            if [ "$sdk" = '26.2' ]; then developer="$path"; break; fi
          done
          if [ -z "$developer" ]; then
            echo 'No installed Xcode with the actual iOS 26.2 simulator SDK.' >&2
            exit 1
          fi
          DEVELOPER_DIR="$developer" xcodebuild -version
          DEVELOPER_DIR="$developer" xcrun --sdk iphonesimulator --show-sdk-version
          printf 'DEVELOPER_DIR=%s\n' "$developer" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Boot the same fresh simulator as release CI
        run: node scripts/feature-acceptance/create-disposable-ios-simulator.mjs
      - name: Measure pure UIKit, never release evidence
        run: bash scripts/diagnostic-uikit/control.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-only-uikit
          path: |
            ${{ runner.temp }}/uikit-control/Control.xcresult
            ${{ runner.temp }}/uikit-control/xctest.log
      - if: always() && env.FEATURE_SIMULATOR != ''
        run: node scripts/feature-acceptance/stop-disposable-ios-simulator.mjs
