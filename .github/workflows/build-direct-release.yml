name: Source-bound macOS Intel supplemental packaging
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  macos-source-bound:
    if: inputs.source_sha == 'd4b3737bcedd1865fe4a5d5fd3249ca60f53adfe'
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: product
    steps:
      - name: Preserve exact source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          repository: 2786886095/novelai-image-desktop
          ref: d4b3737bcedd1865fe4a5d5fd3249ca60f53adfe
          fetch-depth: 0
          persist-credentials: false
          path: product
      - name: Verify immutable product source before building
        run: |
          test "$(git rev-parse HEAD)" = d4b3737bcedd1865fe4a5d5fd3249ca60f53adfe
          test "$(uname -m)" = x86_64
          test "$(node -p "require('./package.json').version")" = 2.7.4
          git diff --exit-code
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Warm Electron binary
        run: npx electron --version
      - name: Install both macOS sharp architectures
        run: node scripts/install-macos-sharp.mjs
      - name: Build universal macOS packages without publication
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --publish never
      - name: Verify product tree and record source-bound non-certifying receipts
        env:
          ORCHESTRATION_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = d4b3737bcedd1865fe4a5d5fd3249ca60f53adfe
          git diff --exit-code
          node - <<'NODE'
          const fs=require('node:fs');
          const product='d4b3737bcedd1865fe4a5d5fd3249ca60f53adfe';
          const version=require('./package.json').version;
          if(version!=='2.7.4'||process.arch!=='x64')throw Error('immutable source/version/runner mismatch');
          fs.writeFileSync('release/direct-release-desktop-macos.json',JSON.stringify({schema:'maintainer-direct-desktop-build/v1',sourceSha:product,platform:'macos',version,fullFunctionalAcceptancePassed:false,extraAcceptancePerformed:false,publicationPerformedByThisWorkflow:false},null,2)+'\n');
          fs.writeFileSync('release/source-bound-macos-orchestration.json',JSON.stringify({schema:'source-bound-macos-orchestration/v1',productSourceSha:product,orchestrationSha:process.env.ORCHESTRATION_SHA,runnerLabel:'macos-15-intel',runnerArch:process.arch,workingTreeClean:true,version,publicationPerformed:false,fullFunctionalAcceptancePassed:false},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: novelai-image-desktop-macos
          path: |
            product/release/*.dmg
            product/release/*.zip
            product/release/direct-release-desktop-macos.json
            product/release/source-bound-macos-orchestration.json
          if-no-files-found: error
