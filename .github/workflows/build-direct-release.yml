# Explicit maintainer-authorized direct-release packaging only.
# Existing verified publishers and their functional gates remain unchanged.
# No provider requests, feature tests, native/GPU acceptance or automatic Release publication.
name: Build Maintainer Direct Release
"on":
  workflow_dispatch:
    inputs:
      maintainer_authorization:
        description: Explicit maintainer waiver; build only, no automated publication or functional certification
        required: true
        type: string
      expected_source_sha:
        description: Exact reviewed source commit for all five platform packages
        required: true
        type: string
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            name: windows
            artifacts: |
              release/*.exe
              release/latest.yml
          - os: ubuntu-latest
            name: linux
            artifacts: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Warm Electron binary
        if: runner.os != 'Linux'
        run: npx electron --version
      - name: Install both macOS sharp architectures
        if: runner.os == 'macOS'
        run: node scripts/install-macos-sharp.mjs
      - name: Build app (${{ matrix.name }})
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Record non-certifying source-bound desktop build receipt
        env:
          DIRECT_RELEASE_SOURCE_SHA: ${{ github.sha }}
          DIRECT_RELEASE_PLATFORM: ${{ matrix.name }}
        shell: bash
        run: |-
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const r={schema:'maintainer-direct-desktop-build/v1',sourceSha:process.env.DIRECT_RELEASE_SOURCE_SHA,platform:process.env.DIRECT_RELEASE_PLATFORM,version:p.version,fullFunctionalAcceptancePassed:false,extraAcceptancePerformed:false,publicationPerformedByThisWorkflow:false};
          fs.writeFileSync('release/direct-release-desktop-'+r.platform+'.json',JSON.stringify(r,null,2)+String.fromCharCode(10));
          console.log(JSON.stringify(r));
          NODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novelai-image-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifacts }}
            release/direct-release-desktop-*.json
          if-no-files-found: error
    if: ${{ inputs.maintainer_authorization == 'DIRECT_RELEASE_WITHOUT_NEW_FUNCTIONAL_ACCEPTANCE' && inputs.expected_source_sha == github.sha }}
  android-agent-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install adapter build dependencies (no desktop binaries)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reuse immutable published runtime when component source is unchanged
        id: published
        run: node harness/android/resolve-published-runtime.mjs
      - name: Build pinned ARM64 Agent runtime
        if: steps.published.outputs.reused != 'true'
        run: bash harness/android/build-rootfs.sh
      - name: Upload Android runtime (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-runtime
          path: artifacts/android-runtime/
          if-no-files-found: error
    if: ${{ inputs.maintainer_authorization == 'DIRECT_RELEASE_WITHOUT_NEW_FUNCTIONAL_ACCEPTANCE' && inputs.expected_source_sha == github.sha }}
  android:
    needs: android-agent-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Prepare verified Android native executables
        working-directory: .
        run: node harness/android/prepare-native.mjs
      - name: Install Agent presentation build dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch same-build runtime for separate component publication
        uses: actions/download-artifact@v4
        with:
          name: android-agent-runtime
          path: artifacts/android-runtime
      - name: Stage verified download descriptor only (no runtime in APK)
        working-directory: .
        run: node harness/android/stage-download.mjs artifacts/android-runtime mobile/android/app/src/main/assets/agent
      - name: Upload download descriptor for component release
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-download-descriptor
          path: artifacts/android-runtime/android-agent.json
          if-no-files-found: error
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify mobile build and displayed version identity
        working-directory: .
        run: python3 scripts/verify-mobile-version.py
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Stable Android signing key is required for release verification."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Release signing configured with a stable key."
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Reject embedded runtime in final APK
        run: |
          python3 - <<'PY'
          import zipfile, json
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              assert not any(n.endswith('agent-rootfs.zip') for n in apk.namelist())
              meta=json.loads(apk.read('assets/agent/seed.json'))
              assert 'asset' not in meta and meta['url'].startswith('https://github.com/2786886095/novelai-image-desktop/releases/download/')
              print('APK ON-DEMAND PASS: descriptor present; runtime absent')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelai-mobile-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
    if: ${{ inputs.maintainer_authorization == 'DIRECT_RELEASE_WITHOUT_NEW_FUNCTIONAL_ACCEPTANCE' && inputs.expected_source_sha == github.sha }}
  ios-package:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true
      - name: Install package build dependencies
        run: flutter pub get
      - name: Verify mobile build and displayed version identity
        working-directory: .
        run: python3 scripts/verify-mobile-version.py
      - name: Compile unsigned iOS package (no functional verification)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (requires user signing)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr ../../../novelai-mobile-unsigned.ipa Payload
          cd -
          ls -lh novelai-mobile-unsigned.ipa
      - name: Emit source-bound unsigned package receipt
        env:
          PACKAGE_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PACKAGE_SOURCE_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, stat, zipfile
          asset = pathlib.Path('novelai-mobile-unsigned.ipa')
          source = os.environ['PACKAGE_SOURCE_SHA']
          assert re.fullmatch('[a-f0-9]{40}', source)
          package = json.loads(pathlib.Path('../package.json').read_text())
          spec = re.search(r'^version:\s*([^\s+]+)\+(\d+)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)
          assert spec and spec[1] == package['version']
          assert stat.S_ISREG(asset.lstat().st_mode) and not asset.is_symlink()
          with zipfile.ZipFile(asset) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              main = [name for name in names if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', name)]
              assert len(main) == 1 and len(names) == len(set(names))
              prefix = main[0][:-len('Info.plist')]
              info = plistlib.loads(archive.read(main[0]))
              executable = info['CFBundleExecutable']
              assert isinstance(executable, str) and executable not in ('', '.', '..') and '/' not in executable and '\\' not in executable
              entry = archive.getinfo(prefix + executable)
              assert entry.file_size > 0 and not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16)
              assert str(info['CFBundleShortVersionString']) == spec[1] and str(info['CFBundleVersion']) == spec[2]
              assert info['CFBundleIdentifier'] == 'com.codex.novelai.novelaiMobile'
              assert prefix + 'embedded.mobileprovision' not in names
              assert not any(item.filename.startswith(prefix + '_CodeSignature/') and not item.is_dir() for item in infos)
              assert archive.testzip() is None
          digest = hashlib.sha256()
          with asset.open('rb') as file:
              for chunk in iter(lambda: file.read(1024 * 1024), b''):
                  digest.update(chunk)
          receipt = {'schema': 'unsigned-ios-package/v1', 'sourceSha': source, 'version': spec[1], 'buildNumber': spec[2], 'asset': asset.name, 'bytes': asset.stat().st_size, 'sha256': digest.hexdigest(), 'bundleIdentifier': info['CFBundleIdentifier'], 'packageKind': 'unsigned-ipa', 'unsigned': True, 'functionalCertificationGranted': False}
          pathlib.Path('ios-package-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload unsigned IPA and package receipt
        uses: actions/upload-artifact@v4
        with:
          name: novelai-mobile-ios-ipa-unsigned
          path: |
            mobile/novelai-mobile-unsigned.ipa
            mobile/ios-package-verification.json
          if-no-files-found: error
    if: ${{ inputs.maintainer_authorization == 'DIRECT_RELEASE_WITHOUT_NEW_FUNCTIONAL_ACCEPTANCE' && inputs.expected_source_sha == github.sha }}
