name: Android ARM64 host capability (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-host-capability:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # existing v5 resolved to immutable official commit
        with:
          persist-credentials: false
      - name: Bounded read-only host inventory (no Android guest execution)
        shell: bash
        run: node scripts/feature-acceptance/android-arm64-capability.mjs --output "$RUNNER_TEMP/android-arm64-capability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # existing v4 immutable official commit
        if: always()
        with:
          name: arm64-host-capability-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-arm64-capability-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
