name: Windows candidate (standalone publication disabled)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Historical field; standalone Windows publication is disabled
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: formal-release-v2.5.7
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Validate release metadata
        run: node scripts/verify-release-windows-metadata.cjs
      - name: Install dependencies
        run: npm ci
      - name: Warm Electron binary
        run: npx electron --version
      - name: Validate desktop source
        run: npm run typecheck && npm test -- --maxWorkers=4
      - name: Build Windows installer and portable
        run: npm run build && npx electron-builder --win portable nsis --x64 --publish never
      - name: Verify packaged native runtime and startup
        run: node scripts/verify-packaged-runtime.mjs
      - name: Verify packaged automatic iteration network transport
        run: node scripts/verify-packaged-detective-network.cjs
      - name: Verify packaged font assets and actual Chinese glyphs
        run: node scripts/verify-packaged-fonts.cjs
      - name: Decode final Windows installers with the actual NSIS decoder
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            node scripts/verify-windows-installer.mjs $_.FullName release/win-unpacked release/installer-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Final installer payload differs from build output' }
          }
      - name: Verify Windows clean installation and upgrade from 2.4.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-windows-upgrade.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-formal-evidence
          path: |
            release/packaged-smoke/
            release/installer-smoke/*.json
            release/upgrade-smoke/*.json
            release/upgrade-smoke/*.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: windows-formal-assets
          path: |
            release/*.exe
          if-no-files-found: error
