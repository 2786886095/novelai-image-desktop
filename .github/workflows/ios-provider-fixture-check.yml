name: iOS ProviderHost fixture (compile only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-fixture-compile:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build isolated app and UI-test targets without installation or execution
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, shutil, signal, stat, subprocess, sys, time

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def choose_device(value):
              candidates = []
              for runtime, devices in value['devices'].items():
                  if not re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+(?:-[0-9]+)*', runtime):
                      continue
                  for device in devices:
                      if device.get('isAvailable') is True and device.get('state') in ('Shutdown', 'Booted') and device.get('name', '').startswith('iPhone') and re.fullmatch(r'[A-Fa-f0-9-]{36}', device.get('udid', '')):
                          candidates.append((runtime, device['udid']))
              assert candidates, 'No available existing iPhone simulator destination; nothing will be created or booted'
              return sorted(candidates)[0][1]

          def device_states(value):
              return sorted((runtime, d['udid'], d.get('state')) for runtime, devices in value['devices'].items() for d in devices)

          def main():
              assert os.environ.get('GITHUB_ACTIONS') == 'true' and sys.platform == 'darwin', 'Disposable macOS Actions only'
              source_sha = os.environ.get('GITHUB_SHA', '')
              run_id, attempt = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('GITHUB_RUN_ATTEMPT', '')
              assert re.fullmatch('[a-f0-9]{40}', source_sha) and re.fullmatch('[0-9]+', run_id) and re.fullmatch('[0-9]+', attempt)
              root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
              temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              output = temp / ('ios-provider-compile-' + run_id + '-' + attempt)
              assert output.parent == temp and root != output and root not in output.parents
              output.mkdir()  # Never reuse, remove or overwrite an existing evidence directory.
              started, commands = time.monotonic(), []
              deadline = started + 660
              child_env = {'PATH': os.environ['PATH'], 'HOME': str(output), 'TMPDIR': str(output), 'LANG': 'en_US.UTF-8', 'LC_ALL': 'en_US.UTF-8'}
              def write(name, value):
                  (output / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
              def command(label, argv, seconds=15):
                  remaining = deadline - time.monotonic()
                  assert remaining > 0, 'Shared compile-only deadline exhausted'
                  timeout = min(seconds, remaining)
                  out, err = output / (label + '.stdout'), output / (label + '.stderr')
                  timed_out = overflow = False
                  with out.open('xb') as stdout, err.open('xb') as stderr:
                      process = subprocess.Popen(argv, cwd=root, env=child_env, stdout=stdout, stderr=stderr, start_new_session=True)
                      stop = time.monotonic() + timeout
                      while process.poll() is None:
                          if time.monotonic() >= stop or out.stat().st_size + err.stat().st_size > 16 * 1024 * 1024:
                              timed_out = time.monotonic() >= stop
                              overflow = out.stat().st_size + err.stat().st_size > 16 * 1024 * 1024
                              try:
                                  os.killpg(process.pid, signal.SIGTERM)
                              except ProcessLookupError:
                                  pass
                              try:
                                  process.wait(timeout=2)
                              except subprocess.TimeoutExpired:
                                  try:
                                      os.killpg(process.pid, signal.SIGKILL)
                                  except ProcessLookupError:
                                      pass
                                  process.wait(timeout=2)
                              break
                          time.sleep(0.05)
                      status = process.wait(timeout=2)
                  overflow = overflow or out.stat().st_size + err.stat().st_size > 16 * 1024 * 1024
                  commands.append({'label': label, 'argv': argv, 'cwd': str(root), 'pid': process.pid, 'timeoutSeconds': timeout, 'exitStatus': status, 'timedOut': timed_out, 'outputOverflow': overflow, 'stdout': out.name, 'stderr': err.name})
                  write('COMMANDS.json', commands)
                  assert status == 0 and not timed_out and not overflow, 'Command failed: ' + label
                  return out.read_bytes()
              def source_identity(label):
                  head = command(label + '-head', ['/usr/bin/git', 'rev-parse', 'HEAD']).decode().strip()
                  assert head == source_sha
                  assert command(label + '-index-head', ['/usr/bin/git', 'diff', '--cached', '--exit-code']) == b''
                  assert command(label + '-clean', ['/usr/bin/git', 'status', '--porcelain', '-z', '--untracked-files=normal']) == b''
                  entries = command(label + '-index', ['/usr/bin/git', 'ls-files', '--stage', '-z']).split(b'\0')
                  manifest = []
                  for entry in filter(None, entries):
                      header, name = entry.split(b'\t', 1)
                      mode, oid, stage = header.decode().split(' ')
                      relative = name.decode('utf-8')
                      assert stage == '0' and mode in ('100644', '100755', '120000')
                      assert not pathlib.PurePosixPath(relative).is_absolute() and '..' not in pathlib.PurePosixPath(relative).parts
                      file = root / relative
                      if mode == '120000':
                          assert file.is_symlink()
                          data = os.fsencode(os.readlink(file))
                      else:
                          assert stat.S_ISREG(file.lstat().st_mode)
                          data = file.read_bytes()
                      assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == oid, 'Raw/index mismatch: ' + relative
                      manifest.append({'path': relative, 'mode': mode, 'gitOid': oid, 'bytes': len(data), 'sha256': digest(data)})
                  assert manifest
                  value = {'head': head, 'manifest': manifest, 'manifestSha256': digest(json.dumps(manifest, sort_keys=True).encode()), 'rawEqualsIndex': True, 'indexEqualsHead': True}
                  write(label + '-manifest.json', value)
                  return value
              result = {'schema': 'ios-provider-compile/v1', 'compileOnly': True, 'nativeExecutionClaimed': False, 'full195Certified': False, 'published': False, 'installedOrLaunched': False, 'sourceSha': source_sha, 'success': False}
              before = None
              try:
                  before = source_identity('before')
                  node = pathlib.Path(shutil.which('node', path=child_env['PATH']) or '').resolve(strict=True)
                  assert node.is_file() and root not in node.parents
                  profile_script = "import {fullFeatureProfiles,profileSha256} from './scripts/feature-acceptance/full-feature-profiles.mjs'; console.log(JSON.stringify({profileSha256,features:Object.keys(fullFeatureProfiles).length,scenarios:Object.values(fullFeatureProfiles).reduce((n,p)=>n+p.scenarios.length,0)}))"
                  profile = json.loads(command('profile', [str(node), '--input-type=module', '-e', profile_script]))
                  assert re.fullmatch('[a-f0-9]{64}', profile['profileSha256']) and profile['features'] == 39 and profile['scenarios'] == 122
                  result['profile'] = profile
                  command('xcode-version', ['/usr/bin/xcodebuild', '-version'])
                  devices_before = json.loads(command('devices-before', ['/usr/bin/xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
                  destination = choose_device(devices_before)
                  project = 'scripts/feature-acceptance/ios-provider-host/ProviderHost.xcodeproj'
                  command('build-for-testing', ['/usr/bin/xcodebuild', '-project', project, '-scheme', 'ProviderHost', '-configuration', 'Debug', '-sdk', 'iphonesimulator', '-destination', 'id=' + destination, '-destination-timeout', '10', '-derivedDataPath', str(output / 'DerivedData'), '-resultBundlePath', str(output / 'Compile.xcresult'), 'CODE_SIGNING_ALLOWED=NO', 'FEATURE_SOURCE_SHA=' + source_sha, 'FEATURE_PROFILE_SHA=' + profile['profileSha256'], 'build-for-testing'], 480)
                  products = output / 'DerivedData/Build/Products'
                  app = products / 'Debug-iphonesimulator/ProviderHost.app'
                  uitest = products / 'Debug-iphonesimulator/ProviderHostUITests-Runner.app/PlugIns/ProviderHostUITests.xctest'
                  assert (app / 'ProviderHost').is_file() and (uitest / 'ProviderHostUITests').is_file()
                  assert list(products.glob('*.xctestrun')) and (output / 'Compile.xcresult').is_dir()
                  info = plistlib.loads((app / 'Info.plist').read_bytes())
                  assert info['CFBundleIdentifier'] == 'org.langbai.nativefixture.providerhost'
                  assert info['FixtureSourceSha'] == source_sha and info['FixtureProfileSha'] == profile['profileSha256']
                  product_manifest = []
                  for file in sorted(products.rglob('*')):
                      if file.is_symlink():
                          data, kind = os.fsencode(os.readlink(file)), 'symlink'
                      elif file.is_file():
                          data, kind = file.read_bytes(), 'file'
                      else:
                          continue
                      product_manifest.append({'path': file.relative_to(products).as_posix(), 'kind': kind, 'bytes': len(data), 'sha256': digest(data)})
                  write('PRODUCT_MANIFEST.json', product_manifest)
                  result['productManifestSha256'] = digest(json.dumps(product_manifest, sort_keys=True).encode())
                  result['compiledAppAndUiTestTargets'] = True
                  result['success'] = True
              except Exception as error:
                  result['error'] = type(error).__name__ + ': ' + str(error)
              finally:
                  try:
                      if before is not None:
                          after = source_identity('after')
                          assert after == before, 'Checkout changed during compilation'
                          result['sourceBeforeAfterExact'] = True
                      if 'devices_before' in locals():
                          devices_after = json.loads(command('devices-after', ['/usr/bin/xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
                          assert device_states(devices_after) == device_states(devices_before), 'Simulator lifecycle changed during compile-only check'
                          result['simulatorLifecycleUnchanged'] = True
                  except Exception as error:
                      result['success'] = False
                      result['finalVerificationError'] = type(error).__name__ + ': ' + str(error)
                  result['elapsedSeconds'] = time.monotonic() - started
                  write('COMPILE_RESULT.json', result)
              print(json.dumps(result, sort_keys=True))
              return 0 if result['success'] else 1

          if __name__ == '__main__':
              sys.exit(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-provider-compile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-provider-compile-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
