name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Warm Electron binary
        run: npx electron --version
      - name: Validate Windows source
        run: npm run typecheck && npm test
      - name: Build Windows installers
        run: npm run build && npx electron-builder --win portable nsis --publish never
      - name: Verify packaged native runtime and startup
        run: node scripts/verify-packaged-runtime.mjs
      - name: Upload packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-windows
          path: |
            release/packaged-smoke/*.json
            release/packaged-smoke/*.log
            release/packaged-smoke/*.png
          if-no-files-found: warn
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: novelai-image-desktop-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
      - name: Attach to draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          draft: true
          files: |
            release/*.exe
            release/latest.yml
