name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate_build_only:
        description: Build private delivery candidates only; skip additional tests and forbid release publication
        type: boolean
        default: false
      publish_after_verification:
        description: Publish the release only after all gates pass
        type: boolean
        default: false
      verified_build_run:
        description: Reuse installers only if all four native build gates passed and application source is identical
        type: string
        required: false
      mobile_run:
        description: Successful Build Mobile run with the identical mobile source tree
        type: string
        required: false
      feature_run:
        description: Same-source native feature run for all five release platforms (Windows/macOS/Linux/Android/iOS)
        type: string
        required: false

      waive_windows_artist_gpu_v286:
        description: v2.8.6 only; allow only the explicitly untested local Windows Artist GPU cell
        type: boolean
        default: false

      waive_windows_artist_gpu_v292:
        description: v2.9.2 only; skip local Windows Artist GPU proof and require all other hosted checks
        type: boolean
        default: false
      waive_windows_artist_gpu_v293:
        description: v2.9.3 only; skip local Windows Artist GPU proof and require all other hosted checks
        type: boolean
        default: false
      waive_windows_artist_gpu_v294:
        description: v2.9.4 only; skip local Windows Artist GPU proof and require all other hosted checks
        type: boolean
        default: false
      waive_windows_artist_gpu_v295:
        description: v2.9.5 only; skip local Windows Artist GPU proof and require all other hosted checks
        type: boolean
        default: false
      reviewed_v307_capsule_release:
        description: Verify the pinned capsule update; omit local Windows Artist GPU proof only and require successful iOS OS receipt
        type: boolean
        default: false
      reviewed_v304_mcp_release:
        description: Verify the exact MCP style release, except local Windows Artist GPU and only the iOS folder naming deadline
        type: boolean
        default: false
      reviewed_v303_capsule_release:
        description: Verify the exact capsule release, except local Windows Artist GPU and only the iOS folder naming deadline
        type: boolean
        default: false
      reviewed_v302_mobile_release:
        description: Verify the exact mobile fix, except local Windows Artist GPU and only the iOS folder naming deadline
        type: boolean
        default: false
      reviewed_v301_role_release:
        description: Publish only the reviewed character bulk-fill source; waive Windows Artist GPU and only the iOS folder naming deadline
        type: boolean
        default: false
      reviewed_v300_ios_folder:
        description: Publish only the reviewed v3.0.0 application commit with the observed ios_folder1 failure and no other iOS exception
        type: boolean
        default: false
      waive_windows_artist_gpu_v300:
        description: v3.0.0 only; skip local Windows Artist GPU proof and require all other hosted checks
        type: boolean
        default: false

# Needed for softprops/action-gh-release to create/attach to Releases on v* tags.
permissions:
  contents: write

# Force bundled JS actions onto Node 24 (silences the Node 20 deprecation notice).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{ !inputs.verified_build_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            name: windows
            artifacts: |
              release/*.exe
              release/latest.yml
          - os: ubuntu-24.04
            name: linux
            artifacts: |
              release/*.AppImage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Electron 42 requires Node >=22.12. Keep CI on the same supported
          # runtime family used by the packaged application tooling.
          node-version: 24
          cache: npm

      - name: Record and require actual Ubuntu 24.04 x64 desktop host
        if: runner.os == 'Linux'
        run: node scripts/feature-acceptance/linux-release-baseline.mjs --source-sha "${{ github.sha }}" --phase desktop-build --output "${{ runner.temp }}/linux-baseline/desktop-build.json"

      - name: Upload Linux baseline identity and raw host commands
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-baseline-desktop-build-${{ github.sha }}
          path: ${{ runner.temp }}/linux-baseline/desktop-build.json
          if-no-files-found: error

      - name: Install dependencies
        env:
          # Linux restores the same four verified CUDA binaries in the next step.
          ONNXRUNTIME_NODE_INSTALL_CUDA: ${{ runner.os == 'Linux' && 'skip' || '' }}
        run: npm ci
      - name: Stage verified Linux ONNX Runtime CUDA binaries
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/feature-acceptance/prepare-ci-onnx-cuda.sh

      - name: Verify Linux baseline identity policy
        if: ${{ !inputs.candidate_build_only }}
        run: node --test scripts/feature-acceptance/linux-release-baseline.test.mjs

      - name: Stage and install checksum-verified Electron
        shell: bash
        run: |
          set -euo pipefail
          node scripts/feature-acceptance/prepare-ci-electron.mjs --package
          node node_modules/electron/install.js

      # Electron 42 may download its binary lazily even after npm ci. Without a
      # serial warm-up, parallel Vitest workers can race while creating
      # electron/dist on fresh Windows and macOS runners (directory exists).
      - name: Warm Electron binary
        if: runner.os != 'Linux'
        run: npx electron --version

      - name: Configure Linux test display and Chromium sandbox (CI only)
        if: runner.os == 'Linux' && !inputs.candidate_build_only
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb fonts-noto-cjk
          node -e "console.log(require('electron'))"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Validate desktop source
        if: ${{ !inputs.candidate_build_only }}
        env:
          COMFY_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/comfyui-ci/jobs
          COMFY_LIFECYCLE_EVIDENCE_DIR: ${{ runner.temp }}/comfyui-ci/lifecycle
          COMFY_SERVICE_EVIDENCE_DIR: ${{ runner.temp }}/comfyui-ci/service
        run: npm run typecheck && npm test

      - name: Retain ComfyUI real-process fixture diagnostics
        if: always() && !inputs.candidate_build_only
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-ci-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/comfyui-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify official image metadata
        if: ${{ !inputs.candidate_build_only }}
        shell: bash
        run: |
          node --test scripts/metadata-browser-server.test.mjs
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:metadata
          else
            npm run test:metadata
          fi

      - name: Install both macOS sharp architectures
        if: runner.os == 'macOS'
        run: |
          node --test scripts/install-macos-sharp.test.mjs
          node scripts/install-macos-sharp.mjs

      - name: Build app (${{ matrix.name }})
        run: npm run build && npx electron-builder --publish never
        env:
          # No signing certs in CI — skip macOS code signing / notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install CJK fonts for Linux UI verification
        if: runner.os == 'Linux' && !inputs.candidate_build_only
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Verify packaged native runtime and startup
        if: ${{ !inputs.candidate_build_only }}
        run: node scripts/verify-packaged-runtime.mjs

      - name: Decode final Windows installers with the actual NSIS decoder
        if: runner.os == 'Windows' && !inputs.candidate_build_only
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            node scripts/verify-windows-installer.mjs $_.FullName release/win-unpacked release/installer-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Final installer payload differs from build output' }
          }

      - name: Verify Windows clean installation and upgrade from 2.4.0
        if: runner.os == 'Windows' && !inputs.candidate_build_only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-windows-upgrade.ps1

      - name: Verify real on-demand Agent download, startup and offline reuse
        if: runner.os == 'Windows' && !inputs.candidate_build_only
        env:
          CI_AGENT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/ci-github-api-auth.test.cjs
          node scripts/verify-agent-on-demand.cjs release/agent-smoke

      - name: Upload packaged smoke evidence
        if: always() && !inputs.candidate_build_only
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.name }}
          path: |
            release/packaged-smoke/*.json
            release/packaged-smoke/*.log
            release/packaged-smoke/*.png
            release/installer-smoke/*.json
            release/upgrade-smoke/*.json
            release/upgrade-smoke/*.jsonl
            release/agent-smoke/verification.json
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novelai-image-desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.candidate_build_only
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          # Desktop hotfixes are published only after all release assets are verified.
          draft: true
          files: ${{ matrix.artifacts }}

  mac-intel-smoke:
    if: ${{ !inputs.candidate_build_only }}
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install locked verification tooling (no build/install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: novelai-image-desktop-macos
          path: release
      - name: Extract the same universal app and verify it on native Intel
        run: |
          mkdir -p release/mac-universal
          ditto -x -k release/*.zip release/mac-universal
          node scripts/verify-packaged-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-macos-intel
          path: |
            release/packaged-smoke/*.json
            release/packaged-smoke/*.log
            release/packaged-smoke/*.png

  publish-verified:
    needs: [build, mac-intel-smoke]
    if: always() && !inputs.candidate_build_only && github.event_name == 'workflow_dispatch' && inputs.publish_after_verification && (inputs.verified_build_run || (needs.build.result == 'success' && needs.mac-intel-smoke.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.reviewed_v301_role_release || inputs.reviewed_v302_mobile_release || inputs.reviewed_v303_capsule_release || inputs.reviewed_v304_mcp_release || inputs.reviewed_v307_capsule_release) && 240 || 25 }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wait for exact v3.0.7 native and package jobs
        if: inputs.reviewed_v307_capsule_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app=f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74
          test "${{ inputs.verified_build_run }}:${{ inputs.mobile_run }}:${{ inputs.feature_run }}" = 45164660467:45164667253:45164673096
          test "${{ inputs.reviewed_v300_ios_folder }}:${{ inputs.reviewed_v301_role_release }}:${{ inputs.reviewed_v302_mobile_release }}:${{ inputs.reviewed_v303_capsule_release }}:${{ inputs.reviewed_v304_mcp_release }}" = false:false:false:false:false
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
          for i in $(seq 1 195); do
            pending=0
            for id in 45164660467 45164667253 45164673096; do
              json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
              jq -e --arg sha "$app" '.head_sha==$sha and .event=="workflow_dispatch"' <<<"$json" >/dev/null
              if [[ "$(jq -r .status <<<"$json")" != completed ]]; then pending=1; continue; fi
              if [[ "$id" != 45164673096 ]]; then jq -e '.conclusion=="success"' <<<"$json" >/dev/null; fi
            done
            if [[ $pending == 0 ]]; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Require the fresh iOS simulator OpenCode Go receipt
        if: inputs.reviewed_v307_capsule_release
        uses: actions/download-artifact@v4
        with:
          name: native-components-ios-text-f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74
          path: reviewed-go-ios
          run-id: 45164673096
          github-token: ${{ github.token }}
      - name: Check all three native Go flows, retries and non-Go controls
        if: inputs.reviewed_v307_capsule_release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p,=Path('reviewed-go-ios').rglob('go-adapter.json')
          r=json.loads(p.read_text())
          assert r['os']=='ios' and r['source']=='f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74' and r['passed'] is True
          assert len(r['steps'])==20 and {s.split(':')[0] for s in r['steps']}=={p+' '+t for p in ('go','deepseek','otherPath','lookalike','control') for t in ('convert','reverse','agent','retry')}
          PY
      - name: Wait for exact v3.0.4 native and package jobs
        if: inputs.reviewed_v304_mcp_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app=826e5e54105520f32d4aa880caf5a9d7bc5ebe93
          test "${{ inputs.verified_build_run }}:${{ inputs.mobile_run }}:${{ inputs.feature_run }}" = 44923782267:44923787166:44923792104
          test "${{ inputs.reviewed_v300_ios_folder }}:${{ inputs.reviewed_v301_role_release }}:${{ inputs.reviewed_v302_mobile_release }}:${{ inputs.reviewed_v303_capsule_release }}" = false:false:false:false
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
          for i in $(seq 1 195); do
            pending=0
            for id in 44923782267 44923787166 44923792104; do
              json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
              jq -e --arg sha "$app" '.head_sha==$sha and .event=="workflow_dispatch"' <<<"$json" >/dev/null
              if [[ "$(jq -r .status <<<"$json")" != completed ]]; then pending=1; continue; fi
              if [[ "$id" != 44923792104 ]]; then jq -e '.conclusion=="success"' <<<"$json" >/dev/null; fi
            done
            if [[ $pending == 0 ]]; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Download current iOS folder witnesses (validate if the native OS group failed)
        if: inputs.reviewed_v304_mcp_release
        uses: actions/download-artifact@v4
        with:
          name: native-components-ios-os-826e5e54105520f32d4aa880caf5a9d7bc5ebe93
          path: reviewed-ios-os
          run-id: 44923792104
          github-token: ${{ github.token }}
      - name: Wait for exact v3.0.3 native and package jobs
        if: inputs.reviewed_v303_capsule_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app=bd7378e8f7a7106158a6cb3e875202510c0afb58
          test "${{ inputs.verified_build_run }}:${{ inputs.mobile_run }}:${{ inputs.feature_run }}" = 44899253021:44899255689:44899258107
          test "${{ inputs.reviewed_v300_ios_folder }}:${{ inputs.reviewed_v301_role_release }}:${{ inputs.reviewed_v302_mobile_release }}" = false:false:false
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
          for i in $(seq 1 195); do
            pending=0
            for id in 44899253021 44899255689 44899258107; do
              json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
              jq -e --arg sha "$app" '.head_sha==$sha and .event=="workflow_dispatch"' <<<"$json" >/dev/null
              if [[ "$(jq -r .status <<<"$json")" != completed ]]; then pending=1; continue; fi
              if [[ "$id" != 44899258107 ]]; then jq -e '.conclusion=="success"' <<<"$json" >/dev/null; fi
            done
            if [[ $pending == 0 ]]; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Download current iOS folder witnesses (validate if the native OS group failed)
        if: inputs.reviewed_v303_capsule_release
        uses: actions/download-artifact@v4
        with:
          name: native-components-ios-os-bd7378e8f7a7106158a6cb3e875202510c0afb58
          path: reviewed-ios-os
          run-id: 44899258107
          github-token: ${{ github.token }}
      - name: Wait for exact v3.0.2 native and package jobs
        if: inputs.reviewed_v302_mobile_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app=0b5e4b8268ba03a57706a74c7309bfbe3f928556
          test "${{ inputs.verified_build_run }}:${{ inputs.mobile_run }}:${{ inputs.feature_run }}" = 44890835829:44890839642:44890842540
          test "${{ inputs.reviewed_v300_ios_folder }}:${{ inputs.reviewed_v301_role_release }}" = false:false
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
          for i in $(seq 1 195); do
            pending=0
            for id in 44890835829 44890839642 44890842540; do
              json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
              jq -e --arg sha "$app" '.head_sha==$sha and .event=="workflow_dispatch"' <<<"$json" >/dev/null
              if [[ "$(jq -r .status <<<"$json")" != completed ]]; then pending=1; continue; fi
              if [[ "$id" != 44890842540 ]]; then jq -e '.conclusion=="success"' <<<"$json" >/dev/null; fi
            done
            if [[ $pending == 0 ]]; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Download current iOS folder witnesses (validate if the native OS group failed)
        if: inputs.reviewed_v302_mobile_release
        uses: actions/download-artifact@v4
        with:
          name: native-components-ios-os-0b5e4b8268ba03a57706a74c7309bfbe3f928556
          path: reviewed-ios-os
          run-id: 44890842540
          github-token: ${{ github.token }}
      - name: Wait for the three v3.0.1 source runs (waiting does not grant acceptance)
        if: inputs.reviewed_v301_role_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.verified_build_run }}" = 44746219032
          test "${{ inputs.mobile_run }}" = 44746225000
          test "${{ inputs.feature_run }}" = 44746230248
          for id in 44746219032 44746225000; do
            gh run view "$id" --json headSha,status,conclusion | jq -e '.headSha=="a3cd315029c2bc4314d5a112d3e132806392c693" and .status=="completed" and .conclusion=="success"'
          done
          for i in $(seq 1 210); do
            if python3 scripts/v301-complementary-runs.py verify; then exit 0; fi
            sleep 60
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: novelai-image-desktop-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.verified_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Bind reviewed v3.0.0 binaries and test evidence to their original source
        if: inputs.reviewed_v300_ios_folder
        shell: bash
        run: |
          set -euo pipefail
          app=c02d3186fc1b014d3e3611e07b7698cd5c448713
          test "${{ inputs.waive_windows_artist_gpu_v300 }}" = true
          test "${{ inputs.feature_run }}" = 44707958871
          test "${{ inputs.mobile_run }}" = 44707964543
          test "${{ inputs.verified_build_run }}" = 44707970782
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs' ':!scripts/v300-folder-review.test.mjs'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
      - name: Download original iOS OS group observations
        if: inputs.reviewed_v300_ios_folder
        uses: actions/download-artifact@v4
        with:
          name: native-components-ios-os-c02d3186fc1b014d3e3611e07b7698cd5c448713
          path: reviewed-ios-os
          run-id: 44707958871
          github-token: ${{ github.token }}
      - name: Bind reviewed v3.0.1 binaries and test evidence to their original source
        if: inputs.reviewed_v301_role_release
        shell: bash
        run: |
          set -euo pipefail
          app=a3cd315029c2bc4314d5a112d3e132806392c693
          test "${{ inputs.reviewed_v300_ios_folder }}" = false
          test "${{ inputs.feature_run }}" = 44746230248
          test "${{ inputs.mobile_run }}" = 44746225000
          test "${{ inputs.verified_build_run }}" = 44746219032
          git merge-base --is-ancestor "$app" "$GITHUB_SHA"
          git diff --exit-code "$app" "$GITHUB_SHA" -- . ':!.github/workflows/build.yml' ':!scripts/release-platform-contract.mjs' ':!scripts/publish-verified-release.mjs' ':!scripts/v300-folder-review.mjs' ':!scripts/v300-folder-review.test.mjs' ':!scripts/v301-complementary-runs.py'
          git checkout --detach "$app"
          for f in scripts/{v300-folder-review,release-platform-contract,publish-verified-release}.mjs; do git show "$GITHUB_SHA:$f" > "$f"; done
          git show "$GITHUB_SHA:scripts/v301-complementary-runs.py" > scripts/v301-complementary-runs.py
      - name: Rebuild matrix from original results and verified Android replacements
        if: inputs.reviewed_v301_role_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/v301-complementary-runs.py prepare
      - name: Download v3.0.7 native evidence by producing job and immutable artifact ID
        if: inputs.reviewed_v307_capsule_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45164673096
          sha=f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74
          jobs=$(gh run view "$run" --json headSha,status,jobs)
          jq -e --arg sha "$sha" '.headSha==$sha and .status=="completed"' <<<"$jobs" >/dev/null
          fetch_evidence() {
            local name="$1" jobname="$2" dest="$3" job id digest api
            job=$(jq -er --arg job "$jobname" '[.jobs[]|select(.name==$job and .status=="completed")]|if length==1 then .[0].databaseId else error("ambiguous producer") end' <<<"$jobs")
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/producer-$job.log"
            id=$(grep -F "Artifact $name.zip successfully finalized. Artifact ID " "$RUNNER_TEMP/producer-$job.log" | sed -E 's/.*Artifact ID ([0-9]+).*/\1/')
            [[ "$id" =~ ^[0-9]+$ ]]
            api="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            digest=$(gh api "$api" | jq -er --arg sha "$sha" --arg name "$name" --argjson run "$run" 'select(.expired==false and .name==$name and .workflow_run.id==$run and .workflow_run.head_sha==$sha)|.digest|sub("^sha256:";"")')
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            grep -F "SHA256 digest of uploaded artifact zip is $digest" "$RUNNER_TEMP/producer-$job.log" >/dev/null
            gh api --allow-escape-sequences "$api/zip" > "$RUNNER_TEMP/evidence-$id.zip"
            echo "$digest  $RUNNER_TEMP/evidence-$id.zip" | sha256sum --check
            unzip -q "$RUNNER_TEMP/evidence-$id.zip" -d "$dest"
          }
          fetch_evidence five-platform-feature-evidence full-client-feature-matrix release-evidence
          if jq -e '.jobs[]|select(.name=="ios-components (os)" and .conclusion=="failure")' <<<"$jobs" >/dev/null; then
            fetch_evidence "native-components-ios-os-$sha" 'ios-components (os)' reviewed-ios-os
          fi
      - name: Verify and unpack the v3.0.4 native matrix from the completed retry
        if: inputs.reviewed_v304_mcp_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/artifacts/14717608997"
          digest=a8d2fd28256fdbb4c0e4afdff08d81eb0374d950a6ece86769a3bd2bd62176f6
          gh api "$api" | jq -e --arg hash "sha256:$digest" '.expired==false and .name=="five-platform-feature-evidence" and .workflow_run.id==44923792104 and .workflow_run.head_sha=="826e5e54105520f32d4aa880caf5a9d7bc5ebe93" and .digest==$hash' >/dev/null
          gh api --allow-escape-sequences "$api/zip" > "$RUNNER_TEMP/native-matrix-v304.zip"
          echo "$digest  $RUNNER_TEMP/native-matrix-v304.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/native-matrix-v304.zip" -d release-evidence
      - name: Download complete same-source five-platform feature evidence
        if: inputs.feature_run != '' && !inputs.reviewed_v301_role_release && !inputs.reviewed_v304_mcp_release && !inputs.reviewed_v307_capsule_release
        uses: actions/download-artifact@v4
        with:
          name: five-platform-feature-evidence
          path: release-evidence
          run-id: ${{ inputs.feature_run }}
          github-token: ${{ github.token }}
      - name: Verify mobile source, versions, signatures and installer hashes; then publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_V302_MOBILE_RELEASE: ${{ inputs.reviewed_v302_mobile_release }}
          REVIEWED_V303_CAPSULE_RELEASE: ${{ inputs.reviewed_v303_capsule_release }}
          REVIEWED_V304_MCP_RELEASE: ${{ inputs.reviewed_v304_mcp_release }}
          REVIEWED_V307_CAPSULE_RELEASE: ${{ inputs.reviewed_v307_capsule_release }}
          REVIEWED_V301_ROLE_RELEASE: ${{ inputs.reviewed_v301_role_release }}
          REVIEWED_V300_IOS_FOLDER: ${{ inputs.reviewed_v300_ios_folder }}
          FEATURE_RUN: ${{ inputs.feature_run }}
          WAIVE_WINDOWS_ARTIST_GPU_V286: ${{ inputs.waive_windows_artist_gpu_v286 }}
          WAIVE_WINDOWS_ARTIST_GPU_V292: ${{ inputs.waive_windows_artist_gpu_v292 }}
          WAIVE_WINDOWS_ARTIST_GPU_V293: ${{ inputs.waive_windows_artist_gpu_v293 }}
          WAIVE_WINDOWS_ARTIST_GPU_V294: ${{ inputs.waive_windows_artist_gpu_v294 }}
          WAIVE_WINDOWS_ARTIST_GPU_V295: ${{ inputs.waive_windows_artist_gpu_v295 }}
          WAIVE_WINDOWS_ARTIST_GPU_V300: ${{ inputs.waive_windows_artist_gpu_v300 }}
          MOBILE_RUN: ${{ inputs.mobile_run }}
          BUILD_RUN: ${{ inputs.verified_build_run || github.run_id }}
        run: node scripts/publish-verified-release.mjs

      - name: Sync verified release source and multilingual homepage to main
        if: inputs.reviewed_v301_role_release || inputs.reviewed_v302_mobile_release || inputs.reviewed_v303_capsule_release || inputs.reviewed_v304_mcp_release || inputs.reviewed_v307_capsule_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" = false
          git fetch origin main
          git merge-base --is-ancestor FETCH_HEAD f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74
          git push origin "f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "f9cb9ec273ae29c021dfe27a6bbb7f25b0caea74"
          for f in README.md README.en.md README.ja.md README.ko.md README.zh-TW.md; do
            git show "$GITHUB_SHA:$f" | grep -F 'github.com/2786886095/novelai-image-desktop/releases/latest' >/dev/null
          done
