name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed for softprops/action-gh-release to create/attach to Releases on v* tags.
permissions:
  contents: write

# Force bundled JS actions onto Node 24 (silences the Node 20 deprecation notice).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            name: windows
            artifacts: |
              release/*.exe
              release/latest.yml
          - os: ubuntu-latest
            name: linux
            artifacts: |
              release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Electron 42 requires Node >=22.12. Keep CI on the same supported
          # runtime family used by the packaged application tooling.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42 may download its binary lazily even after npm ci. Without a
      # serial warm-up, parallel Vitest workers can race while creating
      # electron/dist on fresh Windows and macOS runners (directory exists).
      - name: Warm Electron binary
        if: runner.os != 'Linux'
        run: npx electron --version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build app (${{ matrix.name }})
        run: npm run build && npx electron-builder --publish never
        env:
          # No signing certs in CI — skip macOS code signing / notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novelai-image-desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          files: ${{ matrix.artifacts }}

      - name: Prepare mainland Gitee updater parts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath release -Filter 'Langbai-NovelAI-Studio-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Windows Setup.exe was not produced' }
          node scripts/prepare-gitee-update.mjs --setup $setup.FullName --output release/gitee-update --version '${{ github.ref_name }}'

      - name: Publish Windows installer to Gitee Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: langbai666
          GITEE_REPO: novelai-image-desktop
          GITEE_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sync-gitee-release.mjs "${{ github.ref_name }}" --dir release/gitee-update --file release/latest.yml
