name: Native five-platform acceptance
on:
  workflow_dispatch:
    inputs:
      desktop:
        type: boolean
        default: true
      mobile:
        type: boolean
        default: true
      android_only:
        type: boolean
        default: false
      linux_only:
        type: boolean
        default: false
      suite:
        type: choice
        options: [core, storage, network, all]
        default: core
permissions:
  contents: read
env:
  APP_SHA: f4135d72f70e1c67bc71b985c6c157c3250a3431
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  desktop:
    if: inputs.desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-latest","platform":"linux"}]' || '[{"os":"ubuntu-latest","platform":"linux"},{"os":"macos-latest","platform":"macos-arm"},{"os":"macos-15-intel","platform":"macos-intel"},{"os":"windows-latest","platform":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install native application dependencies and compile exact app SHA
        working-directory: app
        run: npm ci && npm run build
      - name: Native Linux display and fonts (CI only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb fonts-noto-cjk dbus-x11 gnome-keyring libsecret-1-0
          # Electron 42 lazily installs its dist on first require. Materialize
          # the exact locked binary before configuring its sandbox helper.
          (cd app && node -e "console.log(require('electron'))")
          # Preserve Chromium's sandbox. Configure the downloaded CI helper;
          # never add --no-sandbox or alter a user's installed application.
          sudo chown root:root app/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 app/node_modules/electron/dist/chrome-sandbox
      - name: Execute actual desktop backends and isolated renderer on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a sh controller/acceptance/run-linux.sh app evidence/${{ matrix.platform }} "$APP_SHA" "${{ inputs.suite }}"
      - name: Execute actual desktop backends and isolated renderer
        if: runner.os != 'Linux'
        shell: bash
        run: node controller/acceptance/run-desktop.cjs app evidence/${{ matrix.platform }} "$APP_SHA" "${{ inputs.suite }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ matrix.platform }}
          path: evidence/
          if-no-files-found: warn
  android:
    if: inputs.mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install shared agent presentation build dependencies
        working-directory: app
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Stage external native fixture; verify unchanged app library
        run: python3 controller/acceptance/stage-mobile.py app controller/acceptance/native_mobile_test.dart evidence/android "$APP_SHA"
      - name: Resolve test SDK dependency
        working-directory: app/mobile
        run: flutter pub get
      - name: Enable KVM on CI runner only
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 controller/acceptance/run-mobile.py app evidence/android "$APP_SHA" emulator-5554 android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-android
          path: evidence/
          if-no-files-found: warn
  ios:
    if: inputs.mobile && !inputs.android_only
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Stage external native fixture; verify unchanged app library
        run: python3 controller/acceptance/stage-mobile.py app controller/acceptance/native_mobile_test.dart evidence/ios "$APP_SHA"
      - name: Resolve test SDK dependency
        working-directory: app/mobile
        run: flutter pub get
      - name: Boot CI simulator and execute real plugin/transport/renderer checks
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          python3 controller/acceptance/run-mobile.py app evidence/ios "$APP_SHA" "$DEVICE" ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-ios
          path: evidence/
          if-no-files-found: warn
