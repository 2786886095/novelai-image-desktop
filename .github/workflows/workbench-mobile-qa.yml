name: Workbench field QA (no release)
on:
  push:
    branches: ['codex/qa-mobile-workbench-1795350068434']
permissions:
  contents: read
jobs:
  mac-window:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.14.0'}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Click through production Electron desktop
        run: QA_OUT="$RUNNER_TEMP/capsule-mac" ./node_modules/.bin/electron scripts/qa-workbench-mac.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-window-proof
          path: |
            ${{ runner.temp }}/capsule-mac/*.log
            ${{ runner.temp }}/capsule-mac/*.png
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.0', channel: stable, cache: true}
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/phones.json"
          id=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["devices"];print(next(v["udid"] for k,vs in reversed(list(d.items())) if ".iOS-" in k for v in vs if v["name"].startswith("iPhone") and v["isAvailable"]))' "$RUNNER_TEMP/phones.json")
          echo "IOS_SIM=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id" || xcrun simctl list devices booted | grep "$id"
      - name: Build and install actual simulator app
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign --target integration_test/native_workbench_field_qa.dart
          xcrun simctl bootstatus "$IOS_SIM" -b
          app=build/ios/iphonesimulator/Runner.app
          xcrun simctl install "$IOS_SIM" "$app"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$IOS_SIM" "$id"
          data=$(xcrun simctl get_app_container "$IOS_SIM" "$id" data)
          for i in {1..80}; do [ -f "$data/Documents/FIELD_QA.json" ] && break; sleep 2; done
          cp "$data/Documents/FIELD_QA.json" "$RUNNER_TEMP/FIELD_QA.json"
          cat "$RUNNER_TEMP/FIELD_QA.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1]));assert r["os"]=="ios" and r["passed"] is True and len([s for s in r["steps"] if s.startswith("open:")])==15 and "read-format-save-load-apply-group" in r["steps"]' "$RUNNER_TEMP/FIELD_QA.json"
      - if: always() && env.IOS_SIM != ''
        run: xcrun simctl io "$IOS_SIM" screenshot "$RUNNER_TEMP/ios-field.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-proof
          path: |
            ${{ runner.temp }}/FIELD_QA.json
            ${{ runner.temp }}/ios-field.png
