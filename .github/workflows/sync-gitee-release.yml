name: Sync Gitee Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Reclaim old Gitee release attachment quota
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: langbai666
          GITEE_REPO: novelai-image-desktop
          GITEE_KEEP_TAG: ${{ inputs.tag }}
        run: node scripts/prune-gitee-release-assets.mjs
      - name: Download published Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force .tmp/gitee-source | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern 'Langbai-NovelAI-Studio-Setup-*.exe' --pattern 'latest.yml' --dir .tmp/gitee-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Windows updater chunks
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $setupFile = Get-ChildItem .tmp/gitee-source -Filter 'Langbai-NovelAI-Studio-Setup-*.exe' | Select-Object -First 1
          if (-not $setupFile) { throw 'Windows installer missing' }
          node scripts/prepare-gitee-update.mjs --setup "$($setupFile.FullName)" --output .tmp/gitee-update --version "$env:RELEASE_TAG"
      - name: Publish Windows updater to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: langbai666
          GITEE_REPO: novelai-image-desktop
          GITEE_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/sync-gitee-release.mjs "$env:GITEE_RELEASE_TAG" --dir .tmp/gitee-update --file .tmp/gitee-source/latest.yml
