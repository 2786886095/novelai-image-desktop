name: Image metadata regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'shared/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'shared/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-metadata:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify official image metadata
        shell: bash
        run: npm run test:metadata
