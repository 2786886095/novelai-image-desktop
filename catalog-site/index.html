<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Langbai NovelAI · 角色精准参考库</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68748a;--line:#e2e7f0;--accent:#5668ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1280px;margin:auto;padding:32px 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{margin:0;font-size:30px}.hero p{margin:7px 0 0;color:var(--muted)}select,input{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:9px;padding:9px 11px}.toolbar{display:grid;grid-template-columns:1fr 180px 180px 120px;gap:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #1823480c}.thumb{aspect-ratio:2/3;display:grid;place-items:center;background:repeating-conic-gradient(#edf0f5 0 25%,#fff 0 50%) 50%/18px 18px}.thumb img{width:100%;height:100%;object-fit:contain}.body{display:grid;gap:4px;padding:11px}.body strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body small{color:var(--muted)}.body a{display:block;text-align:center;margin-top:6px;padding:8px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none}.count{color:var(--muted);margin:12px 0}.empty{text-align:center;color:var(--muted);padding:40px}.notice{margin:16px 0;padding:12px;border:1px solid #f0d28c;border-radius:10px;background:#fff8e5;color:#765400}@media(max-width:720px){.hero{display:block}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
    @media(prefers-color-scheme:dark){:root{--bg:#111522;--card:#1c2232;--text:#edf1ff;--muted:#a7b0c5;--line:#30394e}.thumb{background:repeating-conic-gradient(#20283a 0 25%,#182033 0 50%) 50%/18px 18px}.notice{background:#302914;color:#f0d78b}}
  </style>
</head>
<body><main>
  <header class="hero"><div><h1>Langbai NovelAI · 角色精准参考库</h1><p id="hint">只提供 NovelAI 精准参考图，每个角色/形态仅保留一个最佳尺寸。</p></div><select id="lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option><option value="en-US">English</option></select></header>
  <div class="notice">仅提供精准参考图下载；原始图和处理图不在下载目录中。图片来源与许可信息以仓库清单为准。</div>
  <section class="toolbar"><input id="search" type="search" placeholder="搜索角色、形态或游戏"><select id="game"><option value="">全部游戏</option></select><select id="category"><option value="">全部分类</option><option value="游戏内角色图">游戏内角色图</option><option value="角色立绘">角色立绘</option></select><button id="reload">刷新</button></section>
  <div class="count" id="count"></div><section class="grid" id="grid"></section>
</main><script>
const C={"zh-CN":{hint:"只提供 NovelAI 精准参考图，每个角色/形态仅保留一个最佳尺寸。",search:"搜索角色、形态或游戏",allGame:"全部游戏",allCategory:"全部分类",inGame:"游戏内角色图",ill:"角色立绘",download:"下载精准参考图",count:n=>`共 ${n} 项`},"zh-TW":{hint:"只提供 NovelAI 精準參考圖，每個角色／形態僅保留一個最佳尺寸。",search:"搜尋角色、形態或遊戲",allGame:"全部遊戲",allCategory:"全部分類",inGame:"遊戲內角色圖",ill:"角色立繪",download:"下載精準參考圖",count:n=>`共 ${n} 項`},"en-US":{hint:"NovelAI precise references only; one best size is kept per character/form.",search:"Search character, form, or game",allGame:"All games",allCategory:"All categories",inGame:"In-game",ill:"Illustration",download:"Download precise reference",count:n=>`${n} items`},"ja-JP":{hint:"NovelAI 精密参照のみ。キャラクター／形態ごとに最適なサイズを1つだけ保持します。",search:"キャラクター・形態・ゲームを検索",allGame:"すべてのゲーム",allCategory:"すべての分類",inGame:"ゲーム内",ill:"立ち絵",download:"精密参照をダウンロード",count:n=>`${n} 件`},"ko-KR":{hint:"NovelAI 정밀 참조만 제공합니다. 캐릭터/형태마다 최적 크기 하나만 유지합니다.",search:"캐릭터·형태·게임 검색",allGame:"전체 게임",allCategory:"전체 분류",inGame:"게임 내",ill:"일러스트",download:"정밀 참조 다운로드",count:n=>`${n}개`}};
let data={assets:[]},lang="zh-CN";const $=id=>document.getElementById(id);function name(a){return (a.names&&a.names[lang])||a.names?.["zh-CN"]||a.roleId}function render(){const t=C[lang],q=$("search").value.trim().toLowerCase(),g=$("game").value,c=$("category").value;const list=data.assets.filter(a=>(!g||a.game===g)&&(!c||a.category===c)&&(!q||[a.game,a.category,a.roleId,a.variant,...Object.values(a.names||{})].join(" ").toLowerCase().includes(q)));$("count").textContent=t.count(list.length);$("grid").innerHTML=list.map(a=>`<article class="card"><div class="thumb"><img loading="lazy" src="${a.downloadUrl}" alt="${name(a)}"></div><div class="body"><strong title="${name(a)}">${name(a)}</strong><small>${a.game} · ${a.category}</small><small>${a.width}×${a.height}${a.bytes?` · ${(a.bytes/1048576).toFixed(1)} MB`:''}</small><a href="${a.downloadUrl}" download>${t.download}</a></div></article>`).join("")||'<div class="empty">No matching characters</div>'}async function load(){const r=await fetch("./reference-catalog/index.json");data=await r.json();const games=[...new Set(data.assets.map(a=>a.game))].sort();$("game").innerHTML=`<option value="">${C[lang].allGame}</option>`+games.map(g=>`<option>${g}</option>`).join("");render()}$("lang").onchange=e=>{lang=e.target.value;const t=C[lang];$("hint").textContent=t.hint;$("search").placeholder=t.search;$("game").options[0].text=t.allGame;$("category").options[0].text=t.allCategory;$("category").options[1].text=t.inGame;$("category").options[2].text=t.ill;render()};["search","game","category"].forEach(id=>$(id).oninput=render);$("reload").onclick=load;load();
</script></body></html>
