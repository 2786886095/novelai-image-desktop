plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: when android/key.properties exists (CI writes it from repo
// secrets — see .github/workflows/build-mobile.yml) the release APK is signed
// with a STABLE key, so every published version installs over the previous one
// instead of forcing an uninstall. Without it (local dev / forks) we fall back
// to the debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Java helpers alongside Kotlin must also reach javac/D8 (not just Kotlin's resolver).
    sourceSets.main.java.srcDirs += 'src/main/kotlin'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/agentPresentation'))
    namespace = "com.codex.novelai.novelai_mobile"
    // Pinned explicitly (not flutter.compileSdkVersion) because the gal plugin
    // reads compileSdk directly and fails when it's left to the Flutter default.
    compileSdk = 35
    ndkVersion = "26.1.10909125"
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot_legacy.so', '**/libprootloader_legacy.so', '**/libtalloc.so', '**/libandroidshmem.so']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.codex.novelai.novelai_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "com.codex.novelai.novelai_mobile.agent.AgentInstrumentation"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('studioAgentQa')) {
                applicationIdSuffix = '.agenttest'
            }
        }
        release {
            // Stable release key when key.properties is present; otherwise the
            // debug key so `flutter run --release` and forks still build.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Tiny app-owned presentation overlay, separate from the downloaded runtime and
// user-installed/customised plugins. No model/runtime archive enters the APK.
def buildAgentPresentation = tasks.register('buildAgentPresentation', Exec) {
    workingDir rootProject.file('../..')
    commandLine(System.getenv('STUDIO_NODE_BINARY') ?: 'node', 'scripts/prepare-agent-presentation.cjs')
    // Run even when generated files exist: a stale checked-in web bundle must
    // never silently turn a fixed source tree into an old Android UI.
}
def stageAgentPresentation = tasks.register('stageAgentPresentation', Sync) {
    dependsOn(buildAgentPresentation)
    from(rootProject.file('../../harness/plugins/studio-responsive')) {
        include 'index.js', 'package.json', 'lib/client.js'
    }
    into(layout.buildDirectory.dir('generated/agentPresentation/agent-presentation'))
    from(rootProject.file('../../harness/plugins/studio-library')) {
        include 'package.json', 'index.js', 'protocol.js', 'jev-config.js', 'panel-layout-store.js', 'lib/client.js'
        into 'library'
    }
    from(rootProject.file('../../harness/plugins/studio-tools')) {
        include 'package.json', 'index.js'
        into 'tools'
    }
}
tasks.named('preBuild').configure { dependsOn(stageAgentPresentation) }

tasks.configureEach { task ->
    if (task.name.matches('merge.*Assets')) {
        task.doFirst {
            if (file('src/main/assets/agent/agent-rootfs.zip').exists()) {
                throw new GradleException('Agent runtime must be downloaded on demand, not embedded in the APK')
            }
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
